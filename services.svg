<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="1060" height="480" role="img" aria-labelledby="t d">
  <title id="t">What I do</title>
  <desc id="d">Business Application Development: A process lives in spreadsheets, or an idea needs to be seen before anyone says yes. Workflow Automation &amp; Integrations: The same steps get repeated by hand, or information gets copied from one tool to another. Data Management &amp; Reporting: Records are duplicated or inconsistent, and the reports don’t match how the team actually works.</desc>
