    <text x="58.0" y="254.0" class="cd-b" font-size="25" fill="#101014">Business</text><text x="58.0" y="282.8" class="cd-b" font-size="25" fill="#101014">Application</text><text x="58.0" y="311.5" class="cd-b" font-size="25" fill="#101014">Development</text><text x="58.0" y="345.2" class="in" font-size="14" fill="#44443e">A process lives in spreadsheets, or an</text><text x="58.0" y="366.9" class="in" font-size="14" fill="#44443e">idea needs to be seen before anyone</text><text x="58.0" y="388.6" class="in" font-size="14" fill="#44443e">says yes. I turn requirements and</text><text x="58.0" y="410.3" class="in" font-size="14" fill="#44443e">business rules into apps people can</text><text x="58.0" y="432.0" class="in" font-size="14" fill="#44443e">review, test and use.</text>
