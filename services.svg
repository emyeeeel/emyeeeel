<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500" role="img" aria-labelledby="t d">
  <title id="t">What I do</title>
  <desc id="d">Business Application Development: A process lives in spreadsheets, or an idea needs to be seen before anyone says yes. I turn requirements and business rules into apps people can review, test and use. Workflow Automation &amp; Integrations: The same steps get repeated by hand, or information gets copied between tools. I map how work moves, then automate it with n8n, Make.com, APIs, webhooks, and AI where it actually helps. Data Management &amp; Reporting: Records are duplicated and reports don’t match how the team works. I clean and maintain CRM data (usually HubSpot) and build dashboards that answer the questions people actually ask.</desc>
